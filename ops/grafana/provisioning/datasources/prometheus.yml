apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      # Match the exporter's 1 s scrape so the graphs show per-frame detail
      # rather than a smoothed line.
      timeInterval: 1s
