# Prometheus scrapes only the local exporter.
#
# The remote peer's numbers do not come from a second scrape target: they arrive
# over the session link as TelemetrySummary and are re-exported here with
# peer="remote". That is why the AWS security group can stay at "UDP/7000 only"
# -- there is no metrics port exposed to the internet at either end.
global:
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 5s
  external_labels:
    lab: rollback-netcode

scrape_configs:
  - job_name: rollback
    honor_labels: true
    static_configs:
      # Prometheus runs on the host network (see ops/docker-compose.yml), so the
      # loopback-only exporter is directly reachable and stays loopback-only.
      - targets: ["127.0.0.1:9898"]
        labels:
          instance: local
      # The second peer of a local bench run.
      - targets: ["127.0.0.1:9899"]
        labels:
          instance: local-peer2
